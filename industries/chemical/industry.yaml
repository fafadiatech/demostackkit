# Chemical Manufacturing Industry Demo
# ─────────────────────────────────────────────────────────────────────────────
# Run: demostackkit up chemical
# URL: http://chemical.localhost  (admin / admin)

name: "Chemical Manufacturing"
slug: "chemical"
version: "1.0.0"
description: >
  Full-featured ERPNext demo for chemical manufacturers.
  Covers raw material procurement, batch production, quality management,
  finished goods dispatch and customer invoicing.
maintainer: "DemoStackKit Contributors"
license: "MIT"

# ── ERPNext ───────────────────────────────────────────────────────────────────
erpnext_version: "v15"
required_apps:
  - frappe
  - erpnext

# ── Company ───────────────────────────────────────────────────────────────────
company:
  name: "Alpha Chemicals Pvt Ltd"
  abbr: "ACH"
  currency: "INR"
  country: "India"
  default_letter_head: "Alpha Chemicals Letter Head"
  tax_id: "27AABCU9603R2ZY"
  fiscal_year_start: "04-01"

# ── Site ─────────────────────────────────────────────────────────────────────
site:
  name: "chemical.localhost"
  admin_password: "${SITE_ADMIN_PASSWORD:-admin}"
  language: "en"
  timezone: "Asia/Kolkata"

# ── Modules ──────────────────────────────────────────────────────────────────
modules:
  - Accounts
  - Buying
  - Selling
  - Stock
  - Manufacturing
  - Quality Management

# ── Seed Configuration ───────────────────────────────────────────────────────
seed:
  random_seed: 20240102
  volumes:
    customers: 12
    suppliers: 10
    sales_orders: 50
    purchase_orders: 30
    production_orders: 20
    stock_entries: 60
  date_range:
    start: "-180d"
    end: "-1d"

# ── Fixture Files ─────────────────────────────────────────────────────────────
fixtures:
  load_order:
    - custom_fields.json
  print_formats: "fixtures/print_formats/*.json"
  reports: "fixtures/reports/*.json"
  workspaces: "fixtures/workspaces/*.json"
  dashboards: "fixtures/dashboards/*.json"

# ── Data Files ────────────────────────────────────────────────────────────────
data:
  items: "data/items.csv"
  customers: "data/customers.csv"
  suppliers: "data/suppliers.csv"

# ── Sample Users ──────────────────────────────────────────────────────────────
users:
  - email: "production.manager@chemical.demo"
    full_name: "Rajesh Iyer"
    roles:
      - Manufacturing Manager
      - Stock Manager
  - email: "sales.exec@chemical.demo"
    full_name: "Meena Gupta"
    roles:
      - Sales Manager
      - CRM Manager
  - email: "purchase.manager@chemical.demo"
    full_name: "Arvind Nair"
    roles:
      - Purchase Manager
      - Stock Manager
  - email: "accounts@chemical.demo"
    full_name: "Kavita Shah"
    roles:
      - Accounts Manager

# ── Dashboards ────────────────────────────────────────────────────────────────
dashboards:
  default: "production_dashboard"

# ── Reports ───────────────────────────────────────────────────────────────────
reports:
  featured:
    - "Batch Production Report"
    - "Chemical Consumption Report"
    - "Stock Ageing"
    - "Sales Analytics"

# ── Workspaces ────────────────────────────────────────────────────────────────
workspaces:
  default: "Chemical Manufacturing"

# ── Validation Thresholds ─────────────────────────────────────────────────────
validate:
  min_sales_orders: 40
  min_items: 20
  min_customers: 10
  required_doctypes:
    - Item Group
    - Warehouse
