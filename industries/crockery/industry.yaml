# Crockery Manufacturing Industry Demo
# ─────────────────────────────────────────────────────────────────────────────
# Run: demostackkit up crockery
# URL: http://crockery.localhost  (admin / admin)

name: "Crockery Manufacturing"
slug: "crockery"
version: "1.0.0"
description: >
  Full-featured ERPNext demo for crockery and ceramics manufacturers.
  Covers clay procurement, throwing and casting, bisque and glaze firing,
  quality inspection, finished goods dispatch and customer invoicing.
maintainer: "DemoStackKit Contributors"
license: "MIT"

# ── ERPNext ───────────────────────────────────────────────────────────────────
erpnext_version: "v15"
required_apps:
  - frappe
  - erpnext

# Extra apps fetched at runtime via bench get-app
extra_apps:
  - name: hrms
    source: frappe
    branch: version-15
  - name: telephony
    source: frappe
  - name: helpdesk
    source: frappe
    branch: v1.28.0

# ── Company ───────────────────────────────────────────────────────────────────
company:
  name: "PotteryPro Ceramics Pvt Ltd"
  abbr: "PPC"
  currency: "INR"
  country: "India"
  default_letter_head: "PotteryPro Ceramics Letter Head"
  tax_id: "27AABCP5678R1ZX"
  fiscal_year_start: "04-01"

# ── Site ─────────────────────────────────────────────────────────────────────
site:
  name: "crockery.localhost"
  admin_password: "${SITE_ADMIN_PASSWORD:-admin}"
  language: "en"
  timezone: "Asia/Kolkata"

# ── Modules ──────────────────────────────────────────────────────────────────
modules:
  - Accounts
  - Buying
  - Selling
  - Stock
  - Projects
  - Manufacturing
  - HR
  - Payroll
  - Quality Management
  - Assets
  - Support

# ── Seed Configuration ───────────────────────────────────────────────────────
seed:
  random_seed: 20240301
  volumes:
    customers: 12
    suppliers: 8
    sales_orders: 40
    purchase_orders: 20
    production_orders: 15
    stock_entries: 50
    quality_inspections: 20
  date_range:
    start: "-180d"
    end: "-1d"

# ── Fixture Files ─────────────────────────────────────────────────────────────
fixtures:
  load_order:
    - custom_fields.json
  print_formats: "fixtures/print_formats/*.json"
  reports: "fixtures/reports/*.json"
  workspaces: "fixtures/workspaces/*.json"
  dashboards: "fixtures/dashboards/*.json"

# ── Data Files ────────────────────────────────────────────────────────────────
data:
  items: "data/items.csv"
  customers: "data/customers.csv"
  suppliers: "data/suppliers.csv"

# ── Sample Users ──────────────────────────────────────────────────────────────
users:
  - email: "production.manager@crockery.demo"
    full_name: "Amara Nair"
    roles:
      - Manufacturing Manager
      - Stock Manager
  - email: "sales.exec@crockery.demo"
    full_name: "Suresh Iyer"
    roles:
      - Sales Manager
  - email: "purchase.manager@crockery.demo"
    full_name: "Kavitha Reddy"
    roles:
      - Purchase Manager
      - Stock Manager
  - email: "accounts@crockery.demo"
    full_name: "Pradeep Kumar"
    roles:
      - Accounts Manager

# ── Dashboards ────────────────────────────────────────────────────────────────
dashboards:
  default: "production_dashboard"

# ── Reports ───────────────────────────────────────────────────────────────────
reports:
  featured:
    - "Kiln Firing Report"
    - "Glaze Consumption Report"
    - "Stock Ageing"
    - "Sales Analytics"

# ── Workspaces ────────────────────────────────────────────────────────────────
workspaces:
  default: "Crockery Manufacturing"

# ── Validation Thresholds ─────────────────────────────────────────────────────
validate:
  min_sales_orders: 40
  min_items: 15
  min_customers: 8
  required_doctypes:
    - BOM
    - Workstation
    - Operation
    - Item Group
