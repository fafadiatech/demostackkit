# Drones Manufacturing Industry Demo
# ─────────────────────────────────────────────────────────────────────────────
# Run: demostackkit up drones
# URL: http://drones.localhost  (admin / admin)

name: "Drones Manufacturing"
slug: "drones"
version: "1.0.0"
description: >
  Full-featured ERPNext demo for drone manufacturers.
  Covers component procurement, PCB assembly, frame build, firmware calibration,
  flight testing, quality inspection, finished goods dispatch and customer invoicing.
maintainer: "DemoStackKit Contributors"
license: "MIT"

# ── ERPNext ───────────────────────────────────────────────────────────────────
erpnext_version: "v15"
required_apps:
  - frappe
  - erpnext

# Extra apps fetched at runtime via bench get-app
extra_apps:
  - name: hrms
    source: frappe
    branch: version-15
  - name: telephony
    source: frappe
  - name: helpdesk
    source: frappe
    branch: v1.28.0

# ── Company ───────────────────────────────────────────────────────────────────
company:
  name: "SkyForge Drones Pvt Ltd"
  abbr: "SFD"
  currency: "INR"
  country: "India"
  default_letter_head: "SkyForge Drones Letter Head"
  tax_id: "27AABCS1234R1ZX"
  fiscal_year_start: "04-01"

# ── Site ─────────────────────────────────────────────────────────────────────
site:
  name: "drones.localhost"
  admin_password: "${SITE_ADMIN_PASSWORD:-admin}"
  language: "en"
  timezone: "Asia/Kolkata"

# ── Modules ──────────────────────────────────────────────────────────────────
modules:
  - Accounts
  - Buying
  - Selling
  - Stock
  - Projects
  - Manufacturing
  - HR
  - Payroll
  - Quality Management

# ── Seed Configuration ───────────────────────────────────────────────────────
seed:
  random_seed: 20240201
  volumes:
    customers: 15
    suppliers: 10
    sales_orders: 40
    purchase_orders: 25
    production_orders: 20
    stock_entries: 60
    quality_inspections: 25
  date_range:
    start: "-180d"
    end: "-1d"

# ── Fixture Files ─────────────────────────────────────────────────────────────
fixtures:
  load_order:
    - custom_fields.json
  print_formats: "fixtures/print_formats/*.json"
  reports: "fixtures/reports/*.json"
  workspaces: "fixtures/workspaces/*.json"
  dashboards: "fixtures/dashboards/*.json"

# ── Data Files ────────────────────────────────────────────────────────────────
data:
  items: "data/items.csv"
  customers: "data/customers.csv"
  suppliers: "data/suppliers.csv"

# ── Sample Users ──────────────────────────────────────────────────────────────
users:
  - email: "production.manager@drone.demo"
    full_name: "Vikram Nair"
    roles:
      - Manufacturing Manager
      - Stock Manager
  - email: "sales.exec@drone.demo"
    full_name: "Pooja Krishnan"
    roles:
      - Sales Manager
  - email: "purchase.manager@drone.demo"
    full_name: "Arjun Pillai"
    roles:
      - Purchase Manager
      - Stock Manager
  - email: "accounts@drone.demo"
    full_name: "Meena Iyer"
    roles:
      - Accounts Manager

# ── Dashboards ────────────────────────────────────────────────────────────────
dashboards:
  default: "production_dashboard"

# ── Reports ───────────────────────────────────────────────────────────────────
reports:
  featured:
    - "Drone Assembly Report"
    - "Component Consumption Report"
    - "Stock Ageing"
    - "Sales Analytics"

# ── Workspaces ────────────────────────────────────────────────────────────────
workspaces:
  default: "Drones Manufacturing"

# ── Validation Thresholds ─────────────────────────────────────────────────────
validate:
  min_sales_orders: 40
  min_items: 20
  min_customers: 10
  required_doctypes:
    - BOM
    - Workstation
    - Operation
    - Item Group
