# Electrical Equipment Manufacturing Industry Demo
# ─────────────────────────────────────────────────────────────────────────────
# Run: demostackkit up electrical
# URL: http://electrical.localhost  (admin / admin)

name: "Electrical Equipment Manufacturing"
slug: "electrical"
version: "1.0.0"
description: >
  Full-featured ERPNext demo for a switchgear and transformer manufacturer
  producing distribution transformers (100kVA–500kVA), power transformers
  (1MVA), HT switchgear panels (11kV), LT distribution panels (415V), and
  motor control centres. Demonstrates multi-operation transformer manufacturing
  workflows (coil winding, core lamination, assembly, oil filling, HV testing),
  switchgear panel assembly, and electrical-industry quality inspections.
maintainer: "DemoStackKit Contributors"
license: "MIT"

erpnext_version: "v15"
required_apps:
  - frappe
  - erpnext

# Extra apps fetched at runtime via bench get-app
extra_apps:
  - name: hrms
    source: frappe
    branch: version-15
  - name: telephony
    source: frappe
  - name: helpdesk
    source: frappe
    branch: v1.28.0

company:
  name: "PowerTech Electrical Pvt Ltd"
  abbr: "PEL"
  currency: "INR"
  country: "India"
  fiscal_year_start: "04-01"

# Sibling legal entities in the PowerTech group. Item/Customer/Supplier masters
# are shared across all companies (seeded once, no `company` restriction); each
# company gets its own Chart of Accounts, warehouse tree, and Opening Stock.
additional_companies:
  - name: "PowerTech Transformers South Pvt Ltd"
    abbr: "PTS"
    currency: "INR"
    country: "India"
    fiscal_year_start: "04-01"
    opening_stock_qty_scale: 0.55
  - name: "PowerTech Switchgear North Pvt Ltd"
    abbr: "PSN"
    currency: "INR"
    country: "India"
    fiscal_year_start: "04-01"
    opening_stock_qty_scale: 0.35

site:
  name: "electrical.localhost"
  admin_password: "${SITE_ADMIN_PASSWORD:-admin}"
  language: "en"
  timezone: "Asia/Kolkata"

modules:
  - Accounts
  - Buying
  - Selling
  - Stock
  - Projects
  - Manufacturing
  - Quality Management
  - Assets
  - Support

seed:
  random_seed: 20240820
  volumes:
    customers: 12
    suppliers: 10
    sales_orders: 45
    purchase_orders: 35
    quality_inspections: 20
  date_range:
    start: "-180d"
    end: "-1d"
  opening_stock:
    enabled: true
    warehouse: "Raw Material Store"
    fg_warehouse: "Finished Goods Store"
    qty_scale: 1.0
  batch_tracking:
    enabled: true

data:
  items: "data/items.csv"
  customers: "data/customers.csv"
  suppliers: "data/suppliers.csv"

users:
  - email: "production.manager@electrical.demo"
    full_name: "Ramesh Kulkarni"
    roles:
      - Manufacturing Manager
      - Stock Manager
  - email: "engineering@electrical.demo"
    full_name: "Priya Nair"
    roles:
      - Manufacturing Manager
  - email: "sales@electrical.demo"
    full_name: "Suresh Mehta"
    roles:
      - Sales Manager
  - email: "purchase@electrical.demo"
    full_name: "Anita Sharma"
    roles:
      - Purchase Manager
      - Stock Manager
  - email: "accounts@electrical.demo"
    full_name: "Vikram Desai"
    roles:
      - Accounts Manager

validate:
  min_sales_orders: 35
  min_items: 25
  required_doctypes:
    - BOM
    - Routing
    - Workstation
    - Operation
