# Ingredient Manufacturing Industry Demo
# ─────────────────────────────────────────────────────────────────────────────
# Run: demostackkit up ingredientmfg
# URL: http://ingredientmfg.localhost  (admin / admin)

name: "Ingredient Manufacturing"
slug: "ingredientmfg"
version: "1.0.0"
description: >
  Full-featured ERPNext demo for batch-process food and nutraceutical
  ingredient manufacturers. Covers raw botanical and chemical procurement,
  batch extraction and standardisation, quality management, and B2B dispatch
  to formulation and nutraceutical brand customers.
maintainer: "DemoStackKit Contributors"
license: "MIT"

# ── ERPNext ───────────────────────────────────────────────────────────────────
erpnext_version: "v15"
required_apps:
  - frappe
  - erpnext

# Extra apps fetched at runtime via bench get-app
extra_apps:
  - name: hrms
    source: frappe
    branch: version-15
  - name: telephony
    source: frappe
  - name: helpdesk
    source: frappe
    branch: v1.28.0

# ── Company ───────────────────────────────────────────────────────────────────
company:
  name: "Alpha Ingredient Manufacturing Pvt Ltd"
  abbr: "AIM"
  currency: "INR"
  country: "India"
  default_letter_head: "Alpha Ingredient Manufacturing Letter Head"
  tax_id: "27AABCU9604R2ZX"
  fiscal_year_start: "04-01"

# ── Site ─────────────────────────────────────────────────────────────────────
site:
  name: "ingredientmfg.localhost"
  admin_password: "${SITE_ADMIN_PASSWORD:-admin}"
  language: "en"
  timezone: "Asia/Kolkata"

# ── Modules ──────────────────────────────────────────────────────────────────
modules:
  - Accounts
  - Buying
  - Selling
  - Stock
  - Projects
  - Manufacturing
  - Quality Management
  - HR
  - Payroll
  - Assets
  - Support

# ── Seed Configuration ───────────────────────────────────────────────────────
seed:
  random_seed: 20241001
  volumes:
    customers: 15
    suppliers: 15
    sales_orders: 50
    purchase_orders: 30
    production_orders: 20
    stock_entries: 60
    quality_inspections: 25
  date_range:
    start: "-180d"
    end: "-1d"
  opening_stock:
    enabled: true
    warehouse: "Raw Material Store"
    fg_warehouse: "Finished Goods Store"
    qty_scale: 1.0

# ── Fixture Files ─────────────────────────────────────────────────────────────
fixtures:
  load_order:
    - custom_fields.json
  print_formats: "fixtures/print_formats/*.json"
  reports: "fixtures/reports/*.json"
  workspaces: "fixtures/workspaces/*.json"
  dashboards: "fixtures/dashboards/*.json"

# ── Data Files ────────────────────────────────────────────────────────────────
data:
  items: "data/items.csv"
  customers: "data/customers.csv"
  suppliers: "data/suppliers.csv"

# ── Sample Users ──────────────────────────────────────────────────────────────
users:
  - email: "production.manager@ingredientmfg.demo"
    full_name: "Suresh Naidu"
    roles:
      - Manufacturing Manager
      - Stock Manager
  - email: "sales.exec@ingredientmfg.demo"
    full_name: "Priya Menon"
    roles:
      - Sales Manager
  - email: "purchase.manager@ingredientmfg.demo"
    full_name: "Rohit Kapoor"
    roles:
      - Purchase Manager
      - Stock Manager
  - email: "accounts@ingredientmfg.demo"
    full_name: "Anita Desai"
    roles:
      - Accounts Manager

# ── Dashboards ────────────────────────────────────────────────────────────────
dashboards:
  default: "production_dashboard"

# ── Reports ───────────────────────────────────────────────────────────────────
reports:
  featured:
    - "Batch Production Report"
    - "Ingredient Consumption Report"
    - "Stock Ageing"
    - "Sales Analytics"

# ── Workspaces ────────────────────────────────────────────────────────────────
workspaces:
  default: "Ingredient Manufacturing"

# ── Validation Thresholds ─────────────────────────────────────────────────────
validate:
  min_sales_orders: 40
  min_items: 20
  min_customers: 10
  required_doctypes:
    - Item Group
    - Warehouse
