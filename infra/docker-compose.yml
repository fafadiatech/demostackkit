# demostackkit — Master Docker Compose file
#
# Architecture:
#   Shared infrastructure (db, redis, erpnext) is always started.
#   Industry demo environments are activated via Docker Compose profiles.
#
# Usage:
#   demostackkit up garment        ← recommended (uses CLI)
#   docker compose --profile garment up -d   ← direct compose
#
# All ERPNext sites share the same containers. Each industry gets its
# own Frappe site (e.g. garment.localhost) on the shared stack.

# Seeder base — build locally, no Docker Hub pull.
# x- prefix keys at top level are extension fields ignored by compose.
x-seeder-base: &seeder-base
  build:
    context: ..
    dockerfile: docker/images/seeder/Dockerfile
  image: demostackkit/seeder:${DEMOSTACKKIT_VERSION:-latest}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - ../industries:/demostackkit/industries:ro
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    backend:
      condition: service_healthy
  restart: "no"

x-erpnext-env: &erpnext-env
  FRAPPE_SITE_NAME_HEADER: "$$host"
  BACKEND: backend:8000
  SOCKETIO: websocket:9000
  DB_HOST: db
  DB_PORT: "3306"
  REDIS_CACHE: redis-cache:6379
  REDIS_QUEUE: redis-queue:6379

x-erpnext-volumes: &erpnext-volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs
  # Shared with backend so extra apps fetched via `bench get-app` (which lands
  # in apps/ on the container's writable layer) are visible to every other
  # Frappe process container. Without this, sites/apps.txt (on the shared
  # `sites` volume) lists apps that scheduler/queue-*/websocket can't import,
  # since they'd otherwise only have the image's baked-in frappe + erpnext.
  - apps:/home/frappe/frappe-bench/apps
  # `bench get-app` also `pip install -e`s the app into env/ (registering its
  # import path via a .pth file). apps/ alone isn't enough — without sharing
  # env/ too, only backend (where get-app actually ran) can import the app;
  # every other container still raises ModuleNotFoundError.
  - env:/home/frappe/frappe-bench/env

x-erpnext-depends: &erpnext-depends
  depends_on:
    db:
      condition: service_healthy
    redis-cache:
      condition: service_started
    redis-queue:
      condition: service_started

services:

  # ── Shared Infrastructure ────────────────────────────────────────────

  traefik:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "8082:8080"  # Traefik dashboard at http://localhost:8082
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${DB_ROOT_PASSWORD:-erpnext}
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

  # ── ERPNext v15 Shared Application Layer ────────────────────────────
  #
  # IMPORTANT: frappe/erpnext:v15 has gunicorn at
  #   /home/frappe/frappe-bench/env/bin/gunicorn   (NOT in $PATH)
  # The default CMD "start.sh" uses the full path correctly.
  # Do NOT override command: for the backend — let start.sh handle it.
  #
  # The sites/ volume mounts over the image's baked-in sites/ directory,
  # wiping common_site_config.json. The `configurator` service below
  # recreates it before the backend starts.

  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    # bench set-config -g passes values through ast.literal_eval, which rejects
    # bare strings like "redis://...". Write the JSON file directly instead.
    command: bash /configure.sh
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./configure.sh:/configure.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    restart: "no"

  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    # No command override — default CMD is start.sh which runs gunicorn
    # via full path /home/frappe/frappe-bench/env/bin/gunicorn
    environment:
      <<: *erpnext-env
    volumes: *erpnext-volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:8000/api/method/ping"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    command: nginx-entrypoint.sh
    environment:
      <<: *erpnext-env
      UPSTREAM_REAL_IP_ADDRESS: "127.0.0.1"
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      UPSTREAM_REAL_IP_HEADER: "X-Forwarded-For"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: "50m"
    volumes: *erpnext-volumes
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=HostRegexp(`{site:.+}.localhost`)"
      - "traefik.http.routers.erpnext.entrypoints=web"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"
    restart: unless-stopped

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      <<: *erpnext-env
    volumes: *erpnext-volumes
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    command: bench schedule
    environment:
      <<: *erpnext-env
    volumes: *erpnext-volumes
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    command: bench worker --queue short,default
    environment:
      <<: *erpnext-env
    volumes: *erpnext-volumes
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v15}
    command: bench worker --queue long
    environment:
      <<: *erpnext-env
    volumes: *erpnext-volumes
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Industry Seeders (one per industry, activated via profiles) ─────
  #
  # These containers are for the DIRECT docker compose path:
  #   docker compose --profile garment up -d
  #
  # When using the CLI (`demostackkit up garment`), the seeder containers
  # are NOT started — the CLI seeds via `docker exec` on the backend container.
  #
  # The image is built locally from docker/images/seeder/. Run:
  #   make build-seeder
  # before using profiles directly.

  seeder-garment:
    <<: *seeder-base
    profiles: ["garment"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: garment
      DSK_SITE: garment.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240101}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-chemical:
    <<: *seeder-base
    profiles: ["chemical"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: chemical
      DSK_SITE: chemical.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240102}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-epc:
    <<: *seeder-base
    profiles: ["epc"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: epc
      DSK_SITE: epc.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240103}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-solar:
    <<: *seeder-base
    profiles: ["solar"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: solar
      DSK_SITE: solar.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240104}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-jewellery:
    <<: *seeder-base
    profiles: ["jewellery"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: jewellery
      DSK_SITE: jewellery.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240105}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-automobile:
    <<: *seeder-base
    profiles: ["automobile"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: automobile
      DSK_SITE: automobile.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240106}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-distribution:
    <<: *seeder-base
    profiles: ["distribution"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: distribution
      DSK_SITE: distribution.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240107}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

  seeder-healthcare:
    <<: *seeder-base
    profiles: ["healthcare"]
    environment:
      <<: *erpnext-env
      DSK_INDUSTRY: healthcare
      DSK_SITE: healthcare.localhost
      DSK_SEED_PHASE: ${DSK_SEED_PHASE:-all}
      DSK_RANDOM_SEED: ${DSK_RANDOM_SEED:-20240108}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-erpnext}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-admin}

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  logs:
  apps:
  env:
